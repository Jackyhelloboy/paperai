services:
  model:
    image: vllm/vllm-openai:unlimited-ocr
    restart: unless-stopped
    gpus: all
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    command:
      - baidu/Unlimited-OCR
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --max-model-len
      - "32768"
      - --host
      - "0.0.0.0"
      - --api-key
      - "${UNLIMITED_OCR_API_KEY:?Set UNLIMITED_OCR_API_KEY in the environment}"

volumes:
  model-cache:
