<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>PaperAI — Exam Paper Scanner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface2: #f9fafb;
            --surface3: #f3f4f6;
            --text: #111827;
            --text2: #4b5563;
            --text3: #9ca3af;
            --primary: #111827;
            --primary-hover: #374151;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.06);
            --accent-hover: #1d4ed8;
            --green: #16a34a;
            --green-soft: rgba(22, 163, 74, 0.06);
            --amber: #d97706;
            --amber-soft: rgba(217, 119, 6, 0.06);
            --red: #dc2626;
            --red-soft: rgba(220, 38, 38, 0.06);
            --border: #e5e7eb;
            --border2: #d1d5db;
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
            --transition: all 0.15s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--surface2);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ── Header ────────────────────────────────────────── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: white;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.72rem;
            color: var(--green);
            font-weight: 500;
            padding: 0.25rem 0.625rem;
            background: var(--green-soft);
            border-radius: 100px;
        }

        .header-dot {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Main ──────────────────────────────────────────── */
        .main {
            padding: 2rem 1.25rem 3rem;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── Hero ──────────────────────────────────────────── */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeUp 0.4s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .hero p {
            font-size: 0.9rem;
            color: var(--text2);
            max-width: 360px;
            margin: 0 auto;
        }

        /* ── Upload Card ───────────────────────────────────── */
        .upload-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            animation: fadeUp 0.4s ease-out 0.05s both;
        }

        .upload-zone {
            border: 2px dashed var(--border2);
            border-radius: var(--radius-sm);
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface2);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-zone:active {
            transform: scale(0.99);
        }

        .upload-zone.over {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .upload-zone:hover .upload-icon {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .upload-icon svg {
            width: 24px;
            height: 24px;
            color: var(--text2);
        }

        .upload-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text);
        }

        .upload-sub {
            font-size: 0.8rem;
            color: var(--text3);
        }

        .upload-sub strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── File Preview ──────────────────────────────────── */
        .file-preview {
            display: none;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .file-preview.show {
            display: flex;
        }

        .file-thumb {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-xs);
            object-fit: cover;
            border: 1px solid var(--border);
            background: var(--surface3);
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.125rem;
        }

        .file-meta {
            font-size: 0.72rem;
            color: var(--text3);
        }

        .file-remove {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .file-remove:active {
            border-color: var(--red);
            color: var(--red);
            background: var(--red-soft);
        }

        /* ── Extract Button ────────────────────────────────── */
        .btn-extract {
            display: none;
            width: 100%;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
            background: var(--primary);
            color: white;
        }

        .btn-extract.show {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-extract:active {
            transform: scale(0.98);
            background: var(--primary-hover);
        }

        .btn-extract:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-extract svg {
            width: 18px;
            height: 18px;
        }

        /* ── Progress ──────────────────────────────────────── */
        .progress-wrap {
            display: none;
            margin-top: 1rem;
        }

        .progress-wrap.show {
            display: block;
            animation: fadeUp 0.3s ease-out;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .progress-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text2);
        }

        .progress-pct {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text3);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            height: 4px;
            background: var(--surface3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* ── Error ─────────────────────────────────────────── */
        .error-toast {
            display: none;
            padding: 0.75rem 1rem;
            background: var(--red-soft);
            border: 1px solid rgba(220, 38, 38, 0.15);
            border-radius: var(--radius-sm);
            color: var(--red);
            font-size: 0.82rem;
            font-weight: 500;
            margin-top: 1rem;
            animation: shake 0.3s ease;
        }

        .error-toast.show {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* ── Results ───────────────────────────────────────── */
        .results {
            display: none;
            margin-top: 1.5rem;
        }

        .results.show {
            display: block;
            animation: fadeUp 0.4s ease-out;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .results-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .results-badges {
            display: flex;
            gap: 0.375rem;
        }

        .badge {
            padding: 0.2rem 0.625rem;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 600;
        }

        .badge-green {
            background: var(--green-soft);
            color: var(--green);
        }

        .badge-gray {
            background: var(--surface3);
            color: var(--text2);
        }

        .results-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .action-btn {
            flex: 1;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text2);
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .action-btn:active {
            transform: scale(0.97);
            background: var(--surface2);
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
        }

        /* ── Output Tabs ───────────────────────────────────── */
        .output-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .output-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }

        .output-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--text3);
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .output-tab.active {
            color: var(--text);
            background: var(--surface);
        }

        .output-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 2px;
            background: var(--accent);
            border-radius: 1px 1px 0 0;
        }

        .output-body {
            padding: 1.25rem;
            max-height: 420px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text);
            -webkit-overflow-scrolling: touch;
            word-wrap: break-word;
        }

        .output-body::-webkit-scrollbar { width: 4px; }
        .output-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        .output-raw {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            white-space: pre-wrap;
            font-size: 0.78rem;
            line-height: 1.7;
        }

        /* ── Formatted Output ──────────────────────────────── */
        .fmt-section {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            margin: 1.25rem 0 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .fmt-section:first-child { margin-top: 0; }

        .fmt-marks {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
            background: var(--accent-soft);
            padding: 0.125rem 0.5rem;
            border-radius: 100px;
        }

        .fmt-question {
            margin: 0.375rem 0;
            padding: 0.375rem 0;
        }

        .fmt-num {
            font-weight: 700;
            color: var(--accent);
            margin-right: 0.25rem;
        }

        .fmt-blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 1.5px solid var(--border2);
            margin: 0 0.125rem;
        }

        .fmt-options {
            color: var(--green);
            font-weight: 600;
            font-size: 0.82rem;
        }

        .fmt-tf {
            color: var(--amber);
            font-weight: 600;
        }

        .fmt-matching {
            margin: 0.375rem 0;
            padding: 0.5rem 0.75rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fmt-matching .arrow {
            color: var(--accent);
            font-weight: 700;
        }

        .fmt-matching .en {
            color: var(--green);
            font-weight: 600;
        }

        /* ── Flagged Words ─────────────────────────────────── */
        .flagged-card {
            display: none;
            margin-top: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .flagged-card.show {
            display: block;
            animation: fadeUp 0.3s ease-out;
        }

        .flagged-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--amber-soft);
        }

        .flagged-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--amber);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .flagged-list {
            padding: 0.5rem;
        }

        .flagged-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            border-radius: var(--radius-xs);
            font-size: 0.82rem;
            transition: var(--transition);
        }

        .flagged-item:active {
            background: var(--surface2);
        }

        .flagged-word {
            font-weight: 600;
            color: var(--text);
        }

        .flagged-arrow {
            color: var(--text3);
            font-size: 0.75rem;
        }

        .flagged-suggest {
            color: var(--green);
            font-weight: 600;
        }

        .flagged-reason {
            margin-left: auto;
            font-size: 0.68rem;
            color: var(--text3);
            font-style: italic;
        }

        /* ── Footer ────────────────────────────────────────── */
        .footer {
            text-align: center;
            padding: 2rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .footer-text {
            font-size: 0.72rem;
            color: var(--text3);
        }

        /* ── Mobile ────────────────────────────────────────── */
        @media (max-width: 380px) {
            .main { padding: 1.5rem 1rem 2rem; }
            .hero h1 { font-size: 1.5rem; }
            .upload-zone { padding: 2rem 0.75rem; }
        }

        @media (min-width: 480px) {
            .main { padding: 2.5rem 1.5rem 3rem; }
            .hero h1 { font-size: 2rem; }
        }

        @supports (padding-top: env(safe-area-inset-top)) {
            .header { padding-top: env(safe-area-inset-top); height: calc(56px + env(safe-area-inset-top)); }
            .footer { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <div class="header-logo">P</div>
            <span class="header-title">PaperAI</span>
        </div>
        <div class="header-status">
            <span class="header-dot"></span>
            <span>Online</span>
        </div>
    </header>

    <main class="main">
        <div class="hero">
            <h1>Scan exam papers</h1>
            <p>Upload a photo of any handwritten question paper — text extracted exactly as written</p>
        </div>

        <div class="upload-card">
            <div class="upload-zone" id="dropZone">
                <div class="upload-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                </div>
                <div class="upload-title">Drop a photo here</div>
                <div class="upload-sub">or tap to browse · <strong>JPG, PNG</strong> · 50 MB max</div>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.webp">
            </div>

            <div class="file-preview" id="filePreview">
                <img class="file-thumb" id="fileThumb" src="" alt="">
                <div class="file-info">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-meta" id="fileMeta"></div>
                </div>
                <button class="file-remove" id="clearBtn" title="Remove">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <button class="btn-extract" id="goBtn" disabled>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Extract Text
            </button>

            <div class="progress-wrap" id="prog">
                <div class="progress-info">
                    <span class="progress-label" id="pMsg">Processing...</span>
                    <span class="progress-pct" id="pPct">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="pFill"></div>
                </div>
            </div>

            <div class="error-toast" id="errBox">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="errText"></span>
            </div>
        </div>

        <div class="results" id="resBox">
            <div class="results-header">
                <span class="results-title">Extracted Text</span>
                <div class="results-badges" id="statsBar"></div>
            </div>

            <div class="results-actions">
                <button class="action-btn" onclick="copyText(this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    Copy
                </button>
                <button class="action-btn" onclick="dlTxt()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Download
                </button>
            </div>

            <div class="output-card">
                <div class="output-tabs">
                    <button class="output-tab active" id="tabVerified" onclick="showTab('verified')">Extracted</button>
                    <button class="output-tab" id="tabRaw" onclick="showTab('raw')">Raw OCR</button>
                </div>
                <div class="output-body" id="textOut"></div>
            </div>

            <div class="flagged-card" id="flaggedBox">
                <div class="flagged-header">
                    <div class="flagged-title">Words to review</div>
                </div>
                <div class="flagged-list" id="flaggedList"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-text">PaperAI — Extract text from handwritten exam papers</div>
    </footer>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'https://paperai-backend.onrender.com';
const $ = id => document.getElementById(id);
const dropZone=$('dropZone'),fileInput=$('fileInput'),goBtn=$('goBtn');
const filePreview=$('filePreview'),fileThumb=$('fileThumb'),fileName=$('fileName'),fileMeta=$('fileMeta'),clearBtn=$('clearBtn');
const prog=$('prog'),pFill=$('pFill'),pPct=$('pPct'),pMsg=$('pMsg');
const errBox=$('errBox'),errText=$('errText'),resBox=$('resBox'),textOut=$('textOut');

let file=null, lastResult=null, showingRaw=false;

const fmtSize = b => b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
const showErr = m => { errText.textContent=m; errBox.classList.add('show'); };
const hideErr = () => errBox.classList.remove('show');
const setProg = (pct,msg) => { pFill.style.width=pct+'%'; pPct.textContent=pct+'%'; if(msg)pMsg.textContent=msg; };

function setFile(f) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['jpg','jpeg','png','bmp','webp'].includes(ext)) { showErr('Unsupported file type: .'+ext); return; }
    if (f.size > 52428800) { showErr('File too large (max 50 MB)'); return; }
    file = f;
    fileName.textContent = f.name;
    fileMeta.textContent = fmtSize(f.size) + ' · ' + f.type.split('/')[1].toUpperCase();
    const r = new FileReader();
    r.onload = e => fileThumb.src = e.target.result;
    r.readAsDataURL(f);
    dropZone.style.display = 'none';
    filePreview.classList.add('show');
    goBtn.classList.add('show');
    goBtn.disabled = false;
    hideErr();
    resBox.classList.remove('show');
}

function clearFile() {
    file=null;
    dropZone.style.display = '';
    filePreview.classList.remove('show');
    goBtn.classList.remove('show');
    goBtn.disabled=true;
    hideErr();
    resBox.classList.remove('show');
    fileInput.value='';
}

dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => { if(e.target.files[0]) setFile(e.target.files[0]); };
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('over'); };
dropZone.ondragleave = () => dropZone.classList.remove('over');
dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove('over'); if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); };
clearBtn.onclick = clearFile;

function showTab(tab) {
    showingRaw = tab==='raw';
    $('tabVerified').classList.toggle('active',!showingRaw);
    $('tabRaw').classList.toggle('active',showingRaw);
    if(lastResult) {
        if(showingRaw) {
            textOut.textContent = lastResult.raw_text||'';
            textOut.className = 'output-body output-raw';
        } else {
            textOut.innerHTML = formatOutput(lastResult.text||'');
            textOut.className = 'output-body';
        }
    }
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function formatOutput(text) {
    if(!text) return '<span style="color:var(--text3)">No text detected</span>';
    return esc(text).replace(/\n/g, '<br>');
}

goBtn.onclick = async () => {
    if(!file) return;
    goBtn.disabled=true;
    hideErr();
    resBox.classList.remove('show');
    prog.classList.add('show');
    setProg(5,'Reading file...');

    try {
        setProg(15,'Uploading...');

        const formData = new FormData();
        formData.append('file', file);
        formData.append('language', 'en');
        formData.append('preprocessing', 'auto');
        formData.append('engine', 'auto');

        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 120000);

        const res = await fetch(API+'/api/ocr', {
            method:'POST',
            body: formData,
            signal: ctrl.signal
        });
        clearTimeout(tid);

        if(!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error||'HTTP '+res.status); }

        setProg(80,'Processing text...');
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        if(data.status!=='completed'||!data.result) throw new Error('No results');

        const r=data.result, corr=r.corrections_summary||{};
        const flagged = (corr.corrections||[]).filter(c=>c.confidence<0.97&&c.confidence>=0.70);
        const reasons = {'ocr_char_fix':'OCR misread','similar_words':'similar word'};

        let badges = '';
        badges += `<span class="badge badge-green">${r.full_text.length} chars</span>`;
        if(flagged.length) badges += `<span class="badge badge-gray">${flagged.length} flagged</span>`;
        $('statsBar').innerHTML = badges;

        lastResult = { text:r.full_text, raw_text:r.raw_text||r.full_text };
        showingRaw=false;
        $('tabVerified').classList.add('active');
        $('tabRaw').classList.remove('active');
        textOut.innerHTML = formatOutput(lastResult.text || '');
        textOut.className = 'output-body';

        if(flagged.length) {
            $('flaggedList').innerHTML = flagged.map(f=>`
                <div class="flagged-item">
                    <span class="flagged-word">${f.original}</span>
                    <span class="flagged-arrow">→</span>
                    <span class="flagged-suggest">${f.corrected}</span>
                    <span class="flagged-reason">${reasons[f.source]||f.source||''}</span>
                </div>
            `).join('');
            $('flaggedBox').classList.add('show');
        } else $('flaggedBox').classList.remove('show');

        resBox.classList.add('show');
        setProg(100,'Done');
        setTimeout(() => prog.classList.remove('show'), 800);
    } catch(e) {
        showErr(e.name==='AbortError' ? 'Timed out — try a smaller image.' : e.message);
    } finally {
        goBtn.disabled=false;
    }
};

function fileToBase64(f) {
    return new Promise((ok,err) => {
        const r=new FileReader();
        r.onload=()=>ok(r.result.split(',')[1]);
        r.onerror=err;
        r.readAsDataURL(f);
    });
}

function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href)}
function dlTxt(){if(!lastResult)return;dlBlob(new Blob([lastResult.text],{type:'text/plain;charset=utf-8'}),'paperai.txt')}
function copyText(btn){if(!lastResult)return;navigator.clipboard.writeText(lastResult.text).then(()=>{btn.innerHTML='<svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!';setTimeout(()=>btn.innerHTML='<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg> Copy',1500)})}
</script>
</body>
</html>
