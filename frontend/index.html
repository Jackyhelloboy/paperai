<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperAI - Question Paper OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
            --text:#f1f5f9;--text2:#94a3b8;
            --accent:#3b82f6;--accent2:#2563eb;
            --success:#10b981;--error:#ef4444;--warn:#f59e0b;
            --border:#334155;--radius:12px;
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .wrap{max-width:860px;margin:0 auto;padding:1.5rem}
        header{text-align:center;margin-bottom:2rem}
        header h1{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        header p{color:var(--text2);margin-top:.35rem}

        .drop{border:2px dashed var(--border);border-radius:var(--radius);padding:2.5rem;text-align:center;cursor:pointer;transition:.2s;background:var(--bg2)}
        .drop:hover,.drop.over{border-color:var(--accent);background:rgba(59,130,246,.08)}
        .drop svg{width:56px;height:56px;color:var(--text2);margin-bottom:.75rem}
        .drop h3{font-size:1.1rem;margin-bottom:.3rem}
        .drop small{color:var(--text2)}
        .drop input{display:none}

        .file-bar{display:none;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-top:1rem}
        .file-bar.show{display:flex}
        .file-bar .name{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .file-bar .size{color:var(--text2);font-size:.85rem}
        .file-bar .clear{background:none;border:none;color:var(--error);cursor:pointer;font-size:1.1rem;padding:0 .25rem}

        .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1.25rem 0}
        .field label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.35rem;font-weight:500}
        .field select{width:100%;padding:.65rem;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:.9rem}
        .field select:focus{outline:none;border-color:var(--accent)}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:.15s;width:100%}
        .btn:disabled{opacity:.45;cursor:not-allowed}
        .btn-main{background:var(--accent);color:#fff}
        .btn-main:hover:not(:disabled){background:var(--accent2);transform:translateY(-1px)}
        .btn-cancel{background:var(--error);color:#fff;margin-top:.5rem}

        .prog{display:none;margin:1.5rem 0}
        .prog.show{display:block}
        .prog-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));width:0%;transition:width .3s}
        .prog-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.4rem}
        .prog-msg{color:var(--text2);font-size:.8rem;margin-top:.35rem}

        .err{display:none;padding:.85rem 1rem;background:rgba(239,68,68,.1);border:1px solid var(--error);border-radius:8px;color:var(--error);margin-top:1rem;font-size:.9rem}
        .err.show{display:block}

        .res{display:none;margin-top:1.5rem}
        .res.show{display:block}
        .res-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
        .stats{display:flex;gap:1.25rem}
        .stat-v{font-size:1.4rem;font-weight:700;color:var(--accent)}
        .stat-l{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
        .exports{display:flex;gap:.5rem;flex-wrap:wrap}
        .btn-exp{padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:.8rem;cursor:pointer;transition:.15s}
        .btn-exp:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}

        .text-out{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;white-space:pre-wrap;font-family:'Menlo','Monaco',monospace;font-size:.85rem;line-height:1.65;max-height:480px;overflow-y:auto}
        .text-out::-webkit-scrollbar{width:6px}
        .text-out::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .conf-badge{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.75rem;font-weight:600}
        .conf-high{background:rgba(16,185,129,.15);color:var(--success)}
        .conf-med{background:rgba(245,158,11,.15);color:var(--warn)}
        .conf-low{background:rgba(239,68,68,.15);color:var(--error)}

        footer{text-align:center;margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);color:var(--text2);font-size:.8rem}

        @media(max-width:600px){
            .wrap{padding:1rem}
            header h1{font-size:1.6rem}
            .stats{flex-wrap:wrap;gap:.75rem}
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>PaperAI</h1>
        <p>Extract text from question papers — runs entirely in your browser</p>
    </header>

    <div class="drop" id="dropZone">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <h3>Drop your paper here</h3>
        <small>PDF, JPG, PNG, BMP, TIFF — Max 50 MB</small>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.bmp,.tiff,.tif,.webp">
    </div>

    <div class="file-bar" id="fileBar">
        <span class="name" id="fName"></span>
        <span class="size" id="fSize"></span>
        <button class="clear" id="clearBtn" title="Remove">&times;</button>
    </div>

    <div class="opts">
        <div class="field">
            <label for="lang">Language</label>
            <select id="lang">
                <option value="eng">English</option>
                <option value="hin">Hindi</option>
                <option value="tel">Telugu</option>
            </select>
        </div>
        <div class="field">
            <label for="ppi">Preprocessing</label>
            <select id="ppi">
                <option value="auto">Auto (Recommended)</option>
                <option value="none">None</option>
                <option value="aggressive">Aggressive</option>
            </select>
        </div>
    </div>

    <button class="btn btn-main" id="goBtn" disabled>Extract Text</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none">Cancel</button>

    <div class="prog" id="prog">
        <div class="prog-top">
            <span id="pPct">0%</span>
            <span id="pStep"></span>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="pFill"></div></div>
        <div class="prog-msg" id="pMsg"></div>
    </div>

    <div class="err" id="errBox"></div>

    <div class="res" id="resBox">
        <div class="res-head">
            <div class="stats">
                <div><div class="stat-v" id="sConf">-</div><div class="stat-l">Confidence</div></div>
                <div><div class="stat-v" id="sChars">-</div><div class="stat-l">Characters</div></div>
                <div><div class="stat-v" id="sLines">-</div><div class="stat-l">Lines</div></div>
            </div>
            <div class="exports">
                <button class="btn-exp" onclick="dlTxt()">TXT</button>
                <button class="btn-exp" onclick="dlDocx()">DOCX</button>
                <button class="btn-exp" onclick="dlPdf()">PDF</button>
            </div>
        </div>
        <div class="text-out" id="textOut"></div>
    </div>

    <footer>PaperAI — Client-side OCR — No data leaves your device</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const dropZone=$('dropZone'),fileInput=$('fileInput'),goBtn=$('goBtn');
const fileBar=$('fileBar'),fName=$('fName'),fSize=$('fSize'),clearBtn=$('clearBtn');
const prog=$('prog'),pFill=$('pFill'),pPct=$('pPct'),pStep=$('pStep'),pMsg=$('pMsg');
const errBox=$('errBox'),resBox=$('resBox'),textOut=$('textOut');
const cancelBtn=$('cancelBtn');

let file=null,cancelled=false;

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function showErr(m){errBox.textContent=m;errBox.classList.add('show')}
function hideErr(){errBox.classList.remove('show')}
function showRes(){resBox.classList.add('show')}
function hideRes(){resBox.classList.remove('show')}

function setProg(pct,msg,step){
    pFill.style.width=pct+'%';pPct.textContent=pct+'%';
    if(msg)pMsg.textContent=msg;
    if(step!==undefined)pStep.textContent=step;
}

function setFile(f){
    const ext=f.name.split('.').pop().toLowerCase();
    const ok=['pdf','jpg','jpeg','png','bmp','tiff','tif','webp'];
    if(!ok.includes(ext)){showErr('Unsupported file type: .'+ext);return}
    if(f.size>52428800){showErr('File too large (max 50 MB)');return}
    file=f;fName.textContent=f.name;fSize.textContent=fmtSize(f.size);
    fileBar.classList.add('show');goBtn.disabled=false;hideErr();hideRes()
}
function clearFile(){file=null;fileBar.classList.remove('show');goBtn.disabled=true;hideErr();hideRes();fileInput.value=''}

dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files[0])setFile(e.target.files[0])};
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('over')};
dropZone.ondragleave=()=>dropZone.classList.remove('over');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('over');if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])};
clearBtn.onclick=clearFile;

function preprocessCanvas(canvas,mode){
    const ctx=canvas.getContext('2d');
    const w=canvas.width,h=canvas.height;
    const img=ctx.getImageData(0,0,w,h);
    const d=img.data;

    for(let i=0;i<d.length;i+=4){
        const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        d[i]=d[i+1]=d[i+2]=g;
    }
    if(mode==='none')return canvas;

    const gray=new Uint8ClampedArray(w*h);
    for(let i=0;i<d.length;i+=4)gray[i/4]=d[i];

    if(mode==='aggressive'){
        for(let i=0;i<d.length;i+=4){
            let v=gray[i/4];
            v=Math.min(255,Math.max(0,(v-128)*1.5+128));
            d[i]=d[i+1]=d[i+2]=v;
            gray[i/4]=v;
        }
    }

    const blockSize=15,C=10;
    const out=new Uint8ClampedArray(d.length);
    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            let sum=0,count=0;
            for(let dy=-blockSize;dy<=blockSize;dy+=3){
                for(let dx=-blockSize;dx<=blockSize;dx+=3){
                    const ny=y+dy,nx=x+dx;
                    if(ny>=0&&ny<h&&nx>=0&&nx<w){sum+=gray[ny*w+nx];count++}
                }
            }
            const mean=sum/count;
            const idx=(y*w+x)*4;
            const v=gray[y*w+x]>(mean-C)?255:0;
            out[idx]=out[idx+1]=out[idx+2]=v;out[idx+3]=255;
        }
    }
    ctx.putImageData(new ImageData(out,w,h),0,0);
    return canvas;
}

async function pdfToImages(pdfBlob){
    const data=new Uint8Array(await pdfBlob.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    const imgs=[];
    const scale=2;
    for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale});
        const c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        imgs.push(c);
    }
    return imgs;
}

async function imgToCanvas(img){
    let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
    const minDim=Math.max(w,h);
    let scale=1;
    if(minDim<1500)scale=1500/minDim;
    else if(minDim>4000)scale=4000/minDim;
    w=Math.round(w*scale);h=Math.round(h*scale);
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    const ctx=c.getContext('2d');
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(img,0,0,w,h);
    return c;
}

cancelBtn.onclick=()=>{cancelled=true};

goBtn.onclick=async()=>{
    if(!file)return;
    cancelled=false;
    goBtn.disabled=true;cancelBtn.style.display='block';
    hideErr();hideRes();
    prog.classList.add('show');
    setProg(0,'Starting...','');

    try{
        let canvases=[];
        const ext=file.name.split('.').pop().toLowerCase();
        const lang=$('lang').value;
        const ppMode=$('ppi').value;

        if(ext==='pdf'){
            setProg(2,'Rendering PDF pages...','PDF');
            canvases=await pdfToImages(file);
        }else{
            setProg(2,'Loading image...','Image');
            const url=URL.createObjectURL(file);
            const img=new Image();
            img.crossOrigin='anonymous';
            await new Promise((ok,err)=>{img.onload=ok;img.onerror=()=>err(new Error('Cannot load image — file may be corrupted'))});
            img.src=url;
            canvases=[await imgToCanvas(img)];
            URL.revokeObjectURL(url);
        }

        if(!canvases.length)throw new Error('No pages found in file');
        if(cancelled)throw new Error('Cancelled');

        setProg(8,'Preprocessing image...','Preprocess');
        const processed=canvases.map(c=>preprocessCanvas(c,ppMode));

        if(cancelled)throw new Error('Cancelled');

        // OCR — handle model download progress
        setProg(12,'Downloading OCR model (first time only)...','OCR');

        const results=[];
        const total=processed.length;

        for(let i=0;i<total;i++){
            if(cancelled)throw new Error('Cancelled');

            const pctBase=15+Math.round(75*(i/total));
            setProg(pctBase,`Page ${i+1} of ${total}...`,'OCR');

            const r=await Tesseract.recognize(processed[i], lang, {
                logger:m=>{
                    if(cancelled)return;
                    const s=m.status||'';
                    const p=Math.round((m.progress||0)*100);

                    if(s==='loading tesseract core'){
                        setProg(12,`Loading engine... ${p}%`,'OCR');
                    }else if(s==='initializing tesseract'){
                        setProg(16,`Initializing... ${p}%`,'OCR');
                    }else if(s==='loading language traineddata'){
                        setProg(20+Math.round(p*0.3),`Downloading language data... ${p}%`,'OCR');
                    }else if(s==='initializing api'){
                        setProg(35,`Preparing OCR... ${p}%`,'OCR');
                    }else if(s==='recognizing text'){
                        const inner=Math.round(p);
                        setProg(40+Math.round(inner*0.55),`Page ${i+1}/${total}: ${inner}% recognized`,'OCR');
                    }
                }
            });

            results.push(r.data);
        }

        if(cancelled)throw new Error('Cancelled');

        setProg(96,'Finalizing...','Done');

        const allText=results.map(r=>r.text).filter(t=>t.trim()).join('\n\n--- Page Break ---\n\n');
        const avgConf=results.reduce((s,r)=>s+(r.confidence||0),0)/results.length;
        const totalChars=allText.length;
        const totalLines=allText.split('\n').filter(l=>l.trim()).length;

        const confCls=avgConf>=80?'high':avgConf>=50?'med':'low';
        $('sConf').innerHTML=avgConf.toFixed(1)+'% <span class="conf-badge conf-'+confCls+'">'+(confCls==='high'?'Good':confCls==='med'?'Fair':'Low')+'</span>';
        $('sChars').textContent=totalChars;
        $('sLines').textContent=totalLines;
        textOut.textContent=allText||'(No text detected)';
        showRes();

        setProg(100,'Complete!','');
        window._lastResult={text:allText,conf:avgConf};

    }catch(e){
        if(e.message!=='Cancelled')showErr('Error: '+e.message);
        pMsg.textContent=e.message==='Cancelled'?'Cancelled':'Failed';
    }finally{
        goBtn.disabled=false;cancelBtn.style.display='none';
    }
};

/* ── Export: TXT ── */
function dlTxt(){
    const r=window._lastResult;if(!r)return;
    const b=new Blob([r.text],{type:'text/plain;charset=utf-8'});
    dl(b,'paperai_output.txt');
}

/* ── Export: DOCX (A4, portrait, narrow margins) ── */
function dlDocx(){
    const r=window._lastResult;if(!r)return;
    const lines=r.text.split('\n');

    // A4 in twips: 1 inch = 1440 twips, A4 = 210mm x 297mm
    // Narrow margins: 1.27cm = ~720 twips (0.5 inch)
    const pageW=11906; // 210mm
    const pageH=16838; // 297mm
    const margin=720;  // 0.5 inch narrow margin

    let paras='';
    for(const line of lines){
        const safe=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        paras+=`<w:p><w:r><w:t xml:space="preserve">${safe||' '}</w:t></w:r></w:p>`;
    }

    const docx=`
<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas"
            xmlns:cx="http://schemas.microsoft.com/office/drawing/2014/chartex"
            xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"
            xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"
            xmlns:v="urn:schemas-microsoft-com:vml"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
            xmlns:w10="urn:schemas-microsoft-com:office:word"
            xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml"
            mc:Ignorable="w14 wp14">
  <w:body>
    <w:sectPr>
      <w:pgSz w:w="${pageW}" w:h="${pageH}" w:orient="portrait"/>
      <w:pgMar w:top="${margin}" w:right="${margin}" w:bottom="${margin}" w:left="${margin}" w:header="0" w:footer="0" w:gutter="0"/>
      <w:cols w:space="708"/>
    </w:sectPr>
    ${paras}
  </w:body>
</w:document>`;

    const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

    const wordRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
</Relationships>`;

    // Build ZIP using raw bytes
    const encoder=new TextEncoder();
    const files=[
        {name:'[Content_Types].xml',data:encoder.encode(contentTypes)},
        {name:'_rels/.rels',data:encoder.encode(rels)},
        {name:'word/_rels/document.xml.rels',data:encoder.encode(wordRels)},
        {name:'word/document.xml',data:encoder.encode(docx)}
    ];

    const zip=buildZip(files);
    const b=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    dl(b,'paperai_output.docx');
}

function buildZip(files){
    // Minimal ZIP builder
    const encoder=new TextEncoder();
    const parts=[];
    const centralDir=[];
    let offset=0;

    for(const f of files){
        const nameBytes=encoder.encode(f.name);
        const crc=crc32(f.data);

        // Local file header
        const header=new Uint8Array(30+nameBytes.length);
        const hv=new DataView(header.buffer);
        hv.setUint32(0,0x04034b50,true); // signature
        hv.setUint16(4,20,true); // version needed
        hv.setUint16(6,0,true);  // flags
        hv.setUint16(8,0,true);  // compression: stored
        hv.setUint16(10,0,true); // mod time
        hv.setUint16(12,0,true); // mod date
        hv.setUint32(14,crc,true);
        hv.setUint32(18,f.data.length,true); // compressed size
        hv.setUint32(22,f.data.length,true); // uncompressed size
        hv.setUint16(26,nameBytes.length,true);
        hv.setUint16(28,0,true); // extra field length
        header.set(nameBytes,30);

        parts.push(header,f.data);

        // Central directory entry
        const cd=new Uint8Array(46+nameBytes.length);
        const cdv=new DataView(cd.buffer);
        cdv.setUint32(0,0x02014b50,true); // signature
        cdv.setUint16(4,20,true); // version made by
        cdv.setUint16(6,20,true); // version needed
        cdv.setUint16(8,0,true);  // flags
        cdv.setUint16(10,0,true); // compression
        cdv.setUint16(12,0,true); // mod time
        cdv.setUint16(14,0,true); // mod date
        cdv.setUint32(16,crc,true);
        cdv.setUint32(20,f.data.length,true);
        cdv.setUint32(24,f.data.length,true);
        cdv.setUint16(28,nameBytes.length,true);
        cdv.setUint16(30,0,true); // extra
        cdv.setUint16(32,0,true); // comment
        cdv.setUint16(34,0,true); // disk
        cdv.setUint16(36,0,true); // internal attr
        cdv.setUint32(38,0,true); // external attr
        cdv.setUint32(42,offset,true); // offset
        cd.set(nameBytes,46);

        centralDir.push(cd);
        offset+=header.length+f.data.length;
    }

    const cdOffset=offset;
    let cdSize=0;
    for(const cd of centralDir){parts.push(cd);cdSize+=cd.length}

    // End of central directory
    const eocd=new Uint8Array(22);
    const ev=new DataView(eocd.buffer);
    ev.setUint32(0,0x06054b50,true);
    ev.setUint16(4,0,true);
    ev.setUint16(6,0,true);
    ev.setUint16(8,files.length,true);
    ev.setUint16(10,files.length,true);
    ev.setUint32(12,cdSize,true);
    ev.setUint32(16,cdOffset,true);
    ev.setUint16(20,0,true);
    parts.push(eocd);

    // Combine
    let totalLen=0;
    for(const p of parts)totalLen+=p.length;
    const result=new Uint8Array(totalLen);
    let pos=0;
    for(const p of parts){result.set(p,pos);pos+=p.length}
    return result;
}

function crc32(data){
    let crc=0xFFFFFFFF;
    const table=new Uint32Array(256);
    for(let i=0;i<256;i++){
        let c=i;
        for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        table[i]=c;
    }
    for(let i=0;i<data.length;i++)crc=table[(crc^data[i])&0xFF]^(crc>>>8);
    return(crc^0xFFFFFFFF)>>>0;
}

function dl(blob,name){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
}

/* ── Export: PDF ── */
function dlPdf(){
    const r=window._lastResult;if(!r)return;
    const lines=r.text.split('\n');
    // A4: 595 x 842 pt, narrow margins 40pt
    const pageW=595,pageH=842,margin=40,lineH=13;
    const usableW=pageW-2*margin;

    let objects=[];
    let objNums={};
    let currentObj=1;

    function addObj(content){
        objects.push(content);
        return currentObj++;
    }

    // Catalog
    const catalogId=addObj('<< /Type /Catalog /Pages 2 0 R >>');
    // Pages
    const pagesId=addObj('<< /Type /Pages /Kids [] /Count 0 >>');

    // Font
    const fontId=addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');

    // Build page content streams
    let pageIds=[];
    let pageContent='';
    let y=margin;

    for(const line of lines){
        if(y>pageH-margin){
            if(pageContent){
                const streamId=addObj(`<< /Length ${pageContent.length} >>\nstream\n${pageContent}\nendstream`);
                pageIds.push(addObj(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Contents ${streamId} 0 R /Resources << /Font << /F1 ${fontId} 0 R >> >> >>`));
            }
            pageContent='';y=margin;
        }
        const safe=line.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
        pageContent+=`BT /F1 10 Tf ${margin} ${pageH-y} Td (${safe}) Tj ET\n`;
        y+=lineH;
    }

    if(pageContent){
        const streamId=addObj(`<< /Length ${pageContent.length} >>\nstream\n${pageContent}\nendstream`);
        pageIds.push(addObj(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Contents ${streamId} 0 R /Resources << /Font << /F1 ${fontId} 0 R >> >> >>`));
    }

    // Update Pages kids
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(n=>n+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;

    // Build PDF
    let pdf='%PDF-1.4\n';
    const offsets=[];
    for(let i=0;i<objects.length;i++){
        offsets.push(pdf.length);
        pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n\n`;
    }

    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n`;
    pdf+='0000000000 65535 f \n';
    for(const off of offsets)pdf+=String(off).padStart(10,'0')+' 00000 n \n';

    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;

    const b=new Blob([pdf],{type:'application/pdf'});
    dl(b,'paperai_output.pdf');
}
