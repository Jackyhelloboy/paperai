<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperAI - Question Paper OCR</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
            --text:#f1f5f9;--text2:#94a3b8;
            --accent:#3b82f6;--accent2:#2563eb;
            --success:#10b981;--error:#ef4444;--warn:#f59e0b;
            --border:#334155;--radius:12px;
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .wrap{max-width:860px;margin:0 auto;padding:1.5rem}
        header{text-align:center;margin-bottom:2rem}
        header h1{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        header p{color:var(--text2);margin-top:.35rem}

        .drop{border:2px dashed var(--border);border-radius:var(--radius);padding:2.5rem;text-align:center;cursor:pointer;transition:.2s;background:var(--bg2)}
        .drop:hover,.drop.over{border-color:var(--accent);background:rgba(59,130,246,.08)}
        .drop svg{width:56px;height:56px;color:var(--text2);margin-bottom:.75rem}
        .drop h3{font-size:1.1rem;margin-bottom:.3rem}
        .drop small{color:var(--text2)}
        .drop input{display:none}

        .file-bar{display:none;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-top:1rem}
        .file-bar.show{display:flex}
        .file-bar .name{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .file-bar .size{color:var(--text2);font-size:.85rem}
        .file-bar .clear{background:none;border:none;color:var(--error);cursor:pointer;font-size:1.1rem;padding:0 .25rem}

        .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1.25rem 0}
        .field label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.35rem;font-weight:500}
        .field select{width:100%;padding:.65rem;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:.9rem}
        .field select:focus{outline:none;border-color:var(--accent)}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:.15s;width:100%}
        .btn:disabled{opacity:.45;cursor:not-allowed}
        .btn-main{background:var(--accent);color:#fff}
        .btn-main:hover:not(:disabled){background:var(--accent2);transform:translateY(-1px)}

        .prog{display:none;margin:1.5rem 0}
        .prog.show{display:block}
        .prog-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));width:0%;transition:width .3s}
        .prog-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.4rem}
        .prog-msg{color:var(--text2);font-size:.8rem;margin-top:.35rem}

        .err{display:none;padding:.85rem 1rem;background:rgba(239,68,68,.1);border:1px solid var(--error);border-radius:8px;color:var(--error);margin-top:1rem;font-size:.9rem}
        .err.show{display:block}

        .res{display:none;margin-top:1.5rem}
        .res.show{display:block}
        .res-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
        .stats{display:flex;gap:1.25rem;flex-wrap:wrap}
        .stat-v{font-size:1.4rem;font-weight:700;color:var(--accent)}
        .stat-l{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
        .exports{display:flex;gap:.5rem;flex-wrap:wrap}
        .btn-exp{padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:.8rem;cursor:pointer;transition:.15s}
        .btn-exp:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}

        .text-out{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;white-space:pre-wrap;font-family:'Menlo','Monaco',monospace;font-size:.85rem;line-height:1.65;max-height:480px;overflow-y:auto}
        .text-out::-webkit-scrollbar{width:6px}
        .text-out::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .conf-badge{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.75rem;font-weight:600;margin-left:.5rem}
        .conf-high{background:rgba(16,185,129,.15);color:var(--success)}
        .conf-med{background:rgba(245,158,11,.15);color:var(--warn)}
        .conf-low{background:rgba(239,68,68,.15);color:var(--error)}

        .engine-badge{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.7rem;background:rgba(139,92,246,.15);color:#a78bfa;margin-left:.5rem}

        footer{text-align:center;margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);color:var(--text2);font-size:.8rem}

        @media(max-width:600px){
            .wrap{padding:1rem}
            header h1{font-size:1.6rem}
            .stats{gap:.75rem}
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>PaperAI</h1>
        <p>Extract text from question papers — powered by Python OCR server</p>
    </header>

    <div class="drop" id="dropZone">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <h3>Drop your paper here</h3>
        <small>PDF, JPG, PNG, BMP, TIFF — Max 50 MB</small>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.bmp,.tiff,.tif,.webp">
    </div>

    <div class="file-bar" id="fileBar">
        <span class="name" id="fName"></span>
        <span class="size" id="fSize"></span>
        <button class="clear" id="clearBtn" title="Remove">&times;</button>
    </div>

    <div class="opts">
        <div class="field">
            <label for="lang">Language</label>
            <select id="lang">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
            </select>
        </div>
        <div class="field">
            <label for="ppi">Preprocessing</label>
            <select id="ppi">
                <option value="auto">Auto (Recommended)</option>
                <option value="none">None</option>
                <option value="aggressive">Aggressive</option>
            </select>
        </div>
        <div class="field">
            <label for="engine">OCR Engine</label>
            <select id="engine">
                <option value="auto">Auto (Best)</option>
                <option value="paddle">PaddleOCR</option>
                <option value="easyocr">EasyOCR</option>
            </select>
        </div>
    </div>

    <button class="btn btn-main" id="goBtn" disabled>Extract Text</button>

    <div class="prog" id="prog">
        <div class="prog-top">
            <span id="pPct">0%</span>
            <span id="pStep"></span>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="pFill"></div></div>
        <div class="prog-msg" id="pMsg"></div>
    </div>

    <div class="err" id="errBox"></div>

    <div class="res" id="resBox">
        <div class="res-head">
            <div class="stats">
                <div><div class="stat-v" id="sConf">-</div><div class="stat-l">Confidence</div></div>
                <div><div class="stat-v" id="sChars">-</div><div class="stat-l">Characters</div></div>
                <div><div class="stat-v" id="sPages">-</div><div class="stat-l">Pages</div></div>
                <div><div class="stat-v" id="sEngine">-</div><div class="stat-l">Engine</div></div>
            </div>
            <div class="exports">
                <button class="btn-exp" onclick="dlTxt()">TXT</button>
                <button class="btn-exp" onclick="dlDocx()">DOCX</button>
                <button class="btn-exp" onclick="dlPdf()">PDF</button>
            </div>
        </div>
        <div class="text-out" id="textOut"></div>
    </div>

    <footer>PaperAI — Python PaddleOCR + EasyOCR Server</footer>
</div>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'https://paperai-ocr.jackyhelloboy.workers.dev';

const $=id=>document.getElementById(id);
const dropZone=$('dropZone'),fileInput=$('fileInput'),goBtn=$('goBtn');
const fileBar=$('fileBar'),fName=$('fName'),fSize=$('fSize'),clearBtn=$('clearBtn');
const prog=$('prog'),pFill=$('pFill'),pPct=$('pPct'),pStep=$('pStep'),pMsg=$('pMsg');
const errBox=$('errBox'),resBox=$('resBox'),textOut=$('textOut');

let file=null;

function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function showErr(m){errBox.textContent=m;errBox.classList.add('show')}
function hideErr(){errBox.classList.remove('show')}
function showRes(){resBox.classList.add('show')}
function hideRes(){resBox.classList.remove('show')}
function setProg(pct,msg,step){pFill.style.width=pct+'%';pPct.textContent=pct+'%';if(msg)pMsg.textContent=msg;if(step!==undefined)pStep.textContent=step}

function setFile(f){
    const ext=f.name.split('.').pop().toLowerCase();
    const ok=['pdf','jpg','jpeg','png','bmp','tiff','tif','webp'];
    if(!ok.includes(ext)){showErr('Unsupported file type: .'+ext);return}
    if(f.size>52428800){showErr('File too large (max 50 MB)');return}
    file=f;fName.textContent=f.name;fSize.textContent=fmtSize(f.size);
    fileBar.classList.add('show');goBtn.disabled=false;hideErr();hideRes()
}
function clearFile(){file=null;fileBar.classList.remove('show');goBtn.disabled=true;hideErr();hideRes();fileInput.value=''}

dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files[0])setFile(e.target.files[0])};
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('over')};
dropZone.ondragleave=()=>dropZone.classList.remove('over');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('over');if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])};
clearBtn.onclick=clearFile;

goBtn.onclick=async()=>{
    if(!file)return;
    goBtn.disabled=true;
    hideErr();hideRes();
    prog.classList.add('show');
    setProg(5,'Uploading file...','Upload');

    try{
        const form=new FormData();
        form.append('file',file);
        form.append('language',$('lang').value);
        form.append('preprocessing',$('ppi').value);
        form.append('engine',$('engine').value);

        setProg(10,'Sending to OCR server...','Server');

        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),120000);

        const res=await fetch(API+'/api/ocr',{
            method:'POST',
            body:form,
            signal:controller.signal
        });
        clearTimeout(timeout);

        if(!res.ok){
            const err=await res.json().catch(()=>({detail:'Server error'}));
            throw new Error(err.detail||`HTTP ${res.status}`);
        }

        setProg(90,'Processing results...','Done');
        const data=await res.json();

        if(data.status==='completed'&&data.result){
            const r=data.result;
            const meta=r.metadata||{};
            const conf=meta.average_confidence||0;

            const confPct=Math.round(conf*100);
            const confCls=confPct>=80?'high':confPct>=50?'med':'low';
            $('sConf').innerHTML=confPct+'% <span class="conf-badge conf-'+confCls+'">'+(confCls==='high'?'Good':confCls==='med'?'Fair':'Low')+'</span>';
            $('sChars').textContent=meta.total_characters||r.full_text.length;
            $('sPages').textContent=meta.total_pages||r.pages?.length||1;
            $('sEngine').innerHTML=(meta.engine||'auto')+' <span class="engine-badge">'+(r.pages?.[0]?.engine_used||'')+'</span>';
            textOut.textContent=r.full_text||'(No text detected)';
            showRes();

            window._lastResult={text:r.full_text,conf:conf};
        }else{
            throw new Error('OCR returned no results');
        }

        setProg(100,'Complete!','');
    }catch(e){
        if(e.name==='AbortError')showErr('Request timed out (2 min). File may be too large or server busy.');
        else showErr('Error: '+e.message);
        pMsg.textContent='Failed';
    }finally{
        goBtn.disabled=false;
    }
};

function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href)}

function dlTxt(){const r=window._lastResult;if(!r)return;dl(new Blob([r.text],{type:'text/plain;charset=utf-8'}),'paperai_output.txt')}

function dlDocx(){
    const r=window._lastResult;if(!r)return;
    const lines=r.text.split('\n');
    const pageW=11906,pageH=16838,margin=720;
    let paras='';
    for(const line of lines){
        const safe=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        paras+=`<w:p><w:r><w:t xml:space="preserve">${safe||' '}</w:t></w:r></w:p>`;
    }
    const docx=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    <w:sectPr>
      <w:pgSz w:w="${pageW}" w:h="${pageH}" w:orient="portrait"/>
      <w:pgMar w:top="${margin}" w:right="${margin}" w:bottom="${margin}" w:left="${margin}" w:header="0" w:footer="0" w:gutter="0"/>
    </w:sectPr>
    ${paras}
  </w:body>
</w:document>`;
    const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
    const wr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
</Relationships>`;
    const enc=new TextEncoder();
    const files=[{name:'[Content_Types].xml',data:enc.encode(ct)},{name:'_rels/.rels',data:enc.encode(rels)},{name:'word/_rels/document.xml.rels',data:enc.encode(wr)},{name:'word/document.xml',data:enc.encode(docx)}];
    const zip=buildZip(files);
    dl(new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),'paperai_output.docx');
}

function buildZip(files){
    const enc=new TextEncoder();
    const parts=[],cd=[];let off=0;
    for(const f of files){
        const nb=enc.encode(f.name);
        const crc=crc32(f.data);
        const h=new Uint8Array(30+nb.length);
        const hv=new DataView(h.buffer);
        hv.setUint32(0,0x04034b50,true);hv.setUint16(4,20,true);hv.setUint16(6,0,true);hv.setUint16(8,0,true);
        hv.setUint16(10,0,true);hv.setUint16(12,0,true);hv.setUint32(14,crc,true);hv.setUint32(18,f.data.length,true);
        hv.setUint32(22,f.data.length,true);hv.setUint16(26,nb.length,true);hv.setUint16(28,0,true);
        h.set(nb,30);parts.push(h,f.data);
        const c=new Uint8Array(46+nb.length);
        const cv=new DataView(c.buffer);
        cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
        cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);cv.setUint32(16,crc,true);
        cv.setUint32(20,f.data.length,true);cv.setUint32(24,f.data.length,true);cv.setUint16(28,nb.length,true);
        cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
        cv.setUint32(38,0,true);cv.setUint32(42,off,true);c.set(nb,46);cd.push(c);off+=h.length+f.data.length;
    }
    const cdo=off;let cs=0;for(const c of cd){parts.push(c);cs+=c.length}
    const e=new Uint8Array(22);const ev=new DataView(e.buffer);
    ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);
    ev.setUint16(10,files.length,true);ev.setUint32(12,cs,true);ev.setUint32(16,cdo,true);ev.setUint16(20,0,true);
    parts.push(e);let t=0;for(const p of parts)t+=p.length;
    const r=new Uint8Array(t);let pos=0;for(const p of parts){r.set(p,pos);pos+=p.length}return r;
}

function crc32(data){let c=0xFFFFFFFF;const t=new Uint32Array(256);
for(let i=0;i<256;i++){let v=i;for(let j=0;j<8;j++)v=(v&1)?(0xEDB88320^(v>>>1)):(v>>>1);t[i]=v}
for(let i=0;i<data.length;i++)c=t[(c^data[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}

function dlPdf(){
    const r=window._lastResult;if(!r)return;
    const lines=r.text.split('\n');const pW=595,pH=842,mg=40,lh=13;
    let objs=[],nm=1;const on=[];
    const catId=nm++;on.push(catId);objs.push('<< /Type /Catalog /Pages 2 0 R >>');
    const pagesId=nm++;on.push(pagesId);
    const fontId=nm++;on.push(fontId);objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    let pids=[],pc='',y=mg;
    for(const line of lines){
        if(y>pH-mg){
            if(pc){const sid=nm++;on.push(sid);objs.push(`<< /Length ${pc.length} >>\nstream\n${pc}\nendstream`);
            const pid=nm++;on.push(pid);pids.push(pid);objs.push(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pW} ${pH}] /Contents ${sid} 0 R /Resources << /Font << /F1 ${fontId} 0 R >> >> >>`);}
            pc='';y=mg;
        }
        const s=line.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
        pc+=`BT /F1 10 Tf ${mg} ${pH-y} Td (${s}) Tj ET\n`;y+=lh;
    }
    if(pc){const sid=nm++;on.push(sid);objs.push(`<< /Length ${pc.length} >>\nstream\n${pc}\nendstream`);
    const pid=nm++;on.push(pid);pids.push(pid);objs.push(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pW} ${pH}] /Contents ${sid} 0 R /Resources << /Font << /F1 ${fontId} 0 R >> >> >>`);}
    objs[1]=`<< /Type /Pages /Kids [${pids.map(n=>n+' 0 R').join(' ')}] /Count ${pids.length} >>`;
    let pdf='%PDF-1.4\n';const offs=[];
    for(let i=0;i<objs.length;i++){offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${objs[i]}\nendobj\n\n`}
    const xoff=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
    for(const o of offs)pdf+=String(o).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xoff}\n%%EOF`;
    dl(new Blob([pdf],{type:'application/pdf'}),'paperai_output.pdf');
}
</script>
</body>
</html>
