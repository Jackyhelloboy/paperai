name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/vendor/paperai-teacher-tools.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/scripts/verify-production.mjs'
      - '.github/scripts/sync-cloudflare-usage.py'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify OCR integration and output
        run: |
          npm ci --ignore-scripts
          npm test

      # Creates the drafts database and the page-photo bucket if they are missing,
      # then writes the real database_id into a generated config for the deploy.
      # Both steps are idempotent, so every run converges on the same setup.
      - name: Provision drafts database and page-photo bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          set -euo pipefail
          DB_NAME=paperai-drafts
          BUCKET=paperai-pages

          D1_JSON="$(npx wrangler@4 d1 list --json)"
          if ! grep -q "\"$DB_NAME\"" <<<"$D1_JSON"; then
            echo "Creating D1 database $DB_NAME"
            npx wrangler@4 d1 create "$DB_NAME"
            D1_JSON="$(npx wrangler@4 d1 list --json)"
          fi

          DB_ID="$(printf '%s' "$D1_JSON" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const rows=JSON.parse(raw);
              const hit=rows.find(r=>r.name==="paperai-drafts");
              if(!hit)process.exit(1);
              process.stdout.write(hit.uuid||hit.database_id||"");
            });')"
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve the database id for $DB_NAME" >&2
            exit 1
          fi
          echo "Using D1 database $DB_ID"

          # The checked-in config carries a placeholder id, so build the real config first
          # and let the migration run against it. Migrations must never target the
          # placeholder, or the tables are never created.
          sed "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.toml > wrangler.deploy.toml
          grep -q "$DB_ID" wrangler.deploy.toml
          # Patch the checked-in config too, so the placeholder can never reach
          # the Cloudflare API and fail the deploy with "database not found".
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.toml

          npx wrangler@4 d1 migrations apply "$DB_NAME" --remote --config wrangler.deploy.toml

          BUCKETS="$(npx wrangler@4 r2 bucket list)"
          if ! grep -q "$BUCKET" <<<"$BUCKETS"; then
            echo "Creating R2 bucket $BUCKET"
            npx wrangler@4 r2 bucket create "$BUCKET"
          fi

          # Retain teacher photos until explicit deletion. Remove the old expiry.
          npx wrangler@4 r2 bucket lifecycle remove "$BUCKET" \
            --name expire-draft-pages || true
          RULES="$(npx wrangler@4 r2 bucket lifecycle list "$BUCKET")"
          if grep -q "expire-draft-pages" <<<"$RULES"; then
            echo "Old photo expiry rule remains; refusing to deploy persistent drafts"
            exit 1
          fi
          echo "Draft photos retained until manual deletion"
          echo "Generated worker/wrangler.deploy.toml"

      # Uses an explicit npx wrangler call rather than wrangler-action, because the
# action did not pass --config through and deployed the placeholder database id.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler@4 deploy --config wrangler.deploy.toml

      - name: Sync Cloudflare daily usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/sync-cloudflare-usage.py

      - name: Verify production text extraction and drafts
        run: node .github/scripts/verify-production.mjs
