name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '.github/scripts/check-gemini.cjs'
      - 'tests/gemini-deployment.cjs'
      - '.github/scripts/check-worker-scanning.cjs'
      - 'tests/fixtures/scanning-smoke.png'
  workflow_dispatch:

concurrency:
  group: paperai-worker-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify quota handling before deploying the Worker
        run: |
          node tests/strict-section-layout.cjs
          node tests/mixed-language-suggestions.cjs
          node tests/ai-quota.cjs
          node tests/gemini-fallback.cjs
          node tests/provider-reserve-handoff.cjs
          node tests/answer-bracket-evidence.cjs
          node tests/scan-transport.cjs
          node tests/gemini-deployment.cjs

      - name: Verify backup credential and model access securely
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/check-gemini.cjs --metadata-only

      - name: Configure automatic backup secret when supplied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: worker
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          else
            echo 'No new backup secret supplied; preserving existing backend secrets.'
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy --var PAPERAI_RELEASE_SHA:${{ github.sha }}

      - name: Verify backup generation after deployment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node .github/scripts/check-gemini.cjs --generation-only || {
            check_status=$?
            if [ "$check_status" -eq 2 ]; then
              echo '::warning::Backup secret installed after credential validation. Live generation is temporarily unavailable; image/PDF recognition is not yet verified.'
            else
              exit "$check_status"
            fi
          }

      - name: Verify one synthetic production image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/check-worker-scanning.cjs
