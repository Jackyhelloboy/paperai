name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: paperai-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Word import and export
        run: |
          npm ci --prefix frontend --ignore-scripts
          node tests/worksheet-layout.cjs
          node tests/pdf-editable-layout.cjs
          node tests/docx-import.cjs
          node tests/editable-paper.cjs
          node tests/dense-word-layout.cjs
          node tests/question-paper-model.cjs
          node tests/scan-resume.cjs
          node tests/scan-checkpoints.cjs
          node tests/ocr-review.cjs
          node tests/parallel-providers.cjs
          node tests/pdf-page-pipeline.cjs
          node tests/scan-transport.cjs
          node tests/docx-reference-layout.cjs
          node tests/reference-formats.cjs
          node tests/score-row-contract.cjs
          node tests/exact-word-text.cjs
          node tests/mixed-language-suggestions.cjs
          node tests/clean-question-paper.cjs
          node tests/clean-exam-content.cjs
          node tests/professional-paper.cjs
          node tests/verified-figure-crops.cjs
          node tests/ai-quota.cjs
          node tests/automatic-upload.cjs
          node tests/gemini-fallback.cjs
          node tests/public-gateway.cjs

      - name: Ensure one production deployment path
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/ensure-pages-config.cjs

      - name: Stage frontend document assets
        run: node .github/scripts/build-pages.cjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/cloudflare-pages --project-name=paperai

      - name: Inspect production routing configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/inspect-pages.cjs

      - name: Verify public routes and bounded production load
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-production.cjs

      - name: Save production verification report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: paperai-production-verification
          path: build/production-verification.json
