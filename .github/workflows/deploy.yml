name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Word import and export
        run: |
          npm ci --prefix frontend --ignore-scripts
          node tests/worksheet-layout.cjs
          node tests/pdf-word-layout.cjs
          node tests/pdf-editable-layout.cjs
          node tests/docx-import.cjs
          node tests/editable-paper.cjs
          node tests/question-paper-model.cjs
          node tests/scan-resume.cjs
          node tests/docx-reference-layout.cjs
          node tests/reference-formats.cjs
          node tests/ai-quota.cjs
          node tests/automatic-upload.cjs
          node tests/local-ocr.cjs

      - name: Build Cloudflare usage snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/build-cloudflare-usage.py

      - name: Stage frontend and on-device runtime
        run: node .github/scripts/build-pages.cjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/cloudflare-pages --project-name=paperai
