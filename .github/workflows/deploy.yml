name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Word import and export
        run: |
          npm ci --prefix frontend --ignore-scripts
          node tests/worksheet-layout.cjs
          node tests/pdf-word-layout.cjs
          node tests/pdf-editable-layout.cjs
          node tests/docx-import.cjs
          node tests/editable-paper.cjs
          node tests/question-paper-model.cjs
          node tests/scan-resume.cjs
          node tests/docx-reference-layout.cjs
          node tests/reference-formats.cjs
          node tests/ai-quota.cjs
          node tests/automatic-upload.cjs
          node tests/local-ocr.cjs
          node tests/public-gateway.cjs

      - name: Stage frontend and on-device runtime
        run: node .github/scripts/build-pages.cjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/cloudflare-pages --project-name=paperai

      - name: Verify public routes and bounded production load
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-production.cjs

      - name: Save production verification report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: paperai-production-verification
          path: build/production-verification.json
