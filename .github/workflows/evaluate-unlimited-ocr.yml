name: Evaluate Baidu Unlimited OCR 2
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Public repository test paper to send to Baidu (uses provider credits)
        type: choice
        required: true
        default: hindi-class1
        options: [hindi-class1, hindi-class2, english, maths]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evaluation adapter without model calls
        run: node tests/unlimited-ocr-evaluation.cjs
      - name: Check provider configuration
        env:
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        run: |
          if [ -z "$BAIDU_API_KEY" ] || [ -z "$BAIDU_SECRET_KEY" ]; then
            echo 'Add BAIDU_API_KEY and BAIDU_SECRET_KEY as repository secrets before running this optional evaluation.'
            exit 1
          fi
      - name: Install PDF page-count utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Evaluate selected public fixture
        env:
          FIXTURE: ${{ inputs.fixture }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        run: |
          case "$FIXTURE" in
            hindi-class1) SOURCE='training/hindi class 1.pdf' ;;
            hindi-class2) SOURCE='training/class 2 hindi.pdf' ;;
            english) SOURCE='training/english.pdf' ;;
            maths) SOURCE='training/maths.pdf' ;;
            *) exit 1 ;;
          esac
          PAGE_COUNT=$(pdfinfo "$SOURCE" | awk '/^Pages:/ {print $2}')
          node scripts/evaluate-baidu-unlimited.mjs --input "$SOURCE" --out build/unlimited-ocr-evaluation --expected-pages "$PAGE_COUNT"
      - name: Save evaluation and resume checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlimited-ocr-evaluation
          path: build/unlimited-ocr-evaluation/
          if-no-files-found: ignore
          retention-days: 7
