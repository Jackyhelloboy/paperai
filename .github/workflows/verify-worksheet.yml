name: Verify worksheet preview and Word export

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.html'
      - 'frontend/vendor/commons-pictures.js'
      - 'frontend/vendor/picture-search.js'
      - 'frontend/vendor/professional-paper.js'
      - 'worker/src/ocr-output-guard.js'
      - 'tests/strict-section-layout.cjs'
      - 'worker/src/index.js'
      - 'tests/worksheet-layout.cjs'
      - 'tests/question-paper-model.cjs'
      - 'tests/scan-resume.cjs'
      - 'tests/pdf-page-pipeline.cjs'
      - 'frontend/vendor/page-pipeline.js'
      - 'tests/ai-quota.cjs'
      - 'tests/automatic-upload.cjs'
      - 'frontend/vendor/ai-quota.js'
      - 'tests/gemini-fallback.cjs'
      - 'tests/public-gateway.cjs'
      - 'functions/**'
      - '.github/scripts/build-pages.cjs'
      - 'frontend/vendor/paper-layout.js'
      - 'frontend/vendor/paper-text.js'
      - 'tests/exact-word-text.cjs'
      - 'tests/mixed-language-suggestions.cjs'
      - 'worker/src/paper-layout-rules.js'
      - '.github/workflows/verify-worksheet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worksheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend test dependencies
        run: npm ci --prefix frontend --ignore-scripts
      - name: Validate preview and Word XML
        run: |
          node tests/worksheet-layout.cjs
          node tests/professional-paper.cjs
          node tests/answer-bracket-evidence.cjs
          node tests/figure-text-crops.cjs
          node tests/image-grid-width.cjs
          node tests/image-crop-evidence.cjs
          node tests/simplified-results-ui.cjs
          node tests/picture-search.cjs
          node tests/default-picture-materialization.cjs
          node tests/reviewed-artwork.cjs
          node tests/reviewed-picture-word.cjs
          node tests/online-picture-word.cjs
          node tests/mixed-language-suggestions.cjs
          node tests/strict-section-layout.cjs
      - name: Check Worker JavaScript
        run: |
          node --input-type=module --check < worker/src/index.js
      - name: Check quota and scan recovery
        run: |
          node tests/ai-quota.cjs
          node tests/automatic-upload.cjs
          node tests/scan-resume.cjs
          node tests/pdf-page-pipeline.cjs
          node tests/gemini-fallback.cjs
          node tests/provider-reserve-handoff.cjs
          node tests/public-gateway.cjs

