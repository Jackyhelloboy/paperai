name = "paperai-ocr"
main = "src/index.js"
compatibility_date = "2026-09-08"
account_id = "9195bc9144b0e1c8811dfae71e58c7e4"

# Runtime connection settings are managed in the Cloudflare dashboard.
# Preserve them across code deployments; keep API keys as encrypted secrets.
keep_vars = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[exports.UsageTracker]
type = "durable-object"
storage = "sqlite"
