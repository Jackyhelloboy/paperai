name = "paperai-ocr"
main = "src/index.js"
compatibility_date = "2026-09-08"
account_id = "9195bc9144b0e1c8811dfae71e58c7e4"

# Optional external Unlimited-OCR inference. Configure with `wrangler secret put`:
# UNLIMITED_OCR_BASE_URL: https://your-gpu-host.example/v1
# UNLIMITED_OCR_API_KEY: matching vLLM --api-key
# Setting the URL selects Unlimited-OCR; OCR_PROVIDER can explicitly select
# unlimited-ocr or cloudflare-ai. No model fallback occurs after selection.
# See ../inference/unlimited-ocr/README.md for the GPU deployment recipe.

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[exports.UsageTracker]
type = "durable-object"
storage = "sqlite"
