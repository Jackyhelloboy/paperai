[project]
name = "paperai-worker"
version = "2.0.0"
description = "PaperAI OCR - Cloudflare Python Worker"
requires-python = ">=3.11"

[tool.pywrangler]
entrypoint = "src/entrypoint.py"

[tool.pywrangler.dependencies]
fastapi = ">=0.136.0"
opencv-python = ">=4.11.0"
numpy = ">=2.4.0"
Pillow = ">=12.0.0"
scipy = ">=1.18.0"
scikit-image = ">=0.25.0"
pydantic = ">=2.12.0"
